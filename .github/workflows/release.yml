name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

# Opt the v4-line JavaScript actions (checkout, setup-node, action-gh-release)
# into Node 24 today. They run on Node 20 by default and emit a deprecation
# warning on every release; the runner forces Node 24 on 2026-06-02. Setting
# this env now silences the warning AND avoids surprise breakage in June.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Package has no build or test scripts (ships as pure JS + Docker).
      # We install dependencies so the lockfile is validated, then publish.
      - run: npm ci

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      # Passes only on an SLSA v1 provenance attestation for the exact version
      # this run published (the package.json version). The query reads stdout
      # only, so an error is never read as an attestation; the npm exit code is
      # checked, then the predicate type. It polls (20 attempts, 15s apart)
      # because the attestation can reach the registry after the publish
      # returns. test/release-provenance-verify.test.js runs this block as written.
      - name: Verify provenance on npm
        run: |
          set -uo pipefail
          version="$(node -p 'require("./package.json").version')"
          for attempt in $(seq 1 20); do
            if att="$(npm view "damn-vulnerable-ai-agent@$version" dist.attestations --json 2>/dev/null)" \
               && [ -n "$att" ] \
               && echo "$att" | jq -e '.provenance.predicateType == "https://slsa.dev/provenance/v1"' >/dev/null 2>&1; then
              echo "Provenance verified for damn-vulnerable-ai-agent@$version"
              exit 0
            fi
            echo "No SLSA v1 provenance attestation for damn-vulnerable-ai-agent@$version yet (attempt $attempt of 20), retrying in 15s..."
            sleep 15
          done
          echo "::error::No SLSA v1 provenance attestation on npm for damn-vulnerable-ai-agent@$version after 20 attempts"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
